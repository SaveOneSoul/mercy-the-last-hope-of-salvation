name: Vendor Logos Catholic Bible Corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/vendor_douay_rheims.py'
      - 'scripts/vendor_greek_nt_phase1.py'
      - 'scripts/vendor_greek_nt_production.py'
      - 'cloud-backend/app/logos_interlinear/**'
      - 'cloud-backend/app/logos_greek.py'
      - 'cloud-backend/app/logos_advanced.py'
      - 'tools/validate_logos.py'
      - 'tools/validate_logos_interlinear.py'
      - 'tools/validate_logos_interlinear_prototype.py'
      - 'tools/validate_logos_greek_nt_phase1.py'
      - 'tools/validate_logos_greek_nt_production.py'
      - '.github/workflows/logos-corpus.yml'
  pull_request:
    paths:
      - 'scripts/vendor_douay_rheims.py'
      - 'scripts/vendor_greek_nt_phase1.py'
      - 'scripts/vendor_greek_nt_production.py'
      - 'cloud-backend/app/logos_interlinear/**'
      - 'cloud-backend/app/logos_greek.py'
      - 'cloud-backend/app/logos_advanced.py'
      - 'tools/validate_logos.py'
      - 'tools/validate_logos_interlinear.py'
      - 'tools/validate_logos_interlinear_prototype.py'
      - 'tools/validate_logos_greek_nt_phase1.py'
      - 'tools/validate_logos_greek_nt_production.py'
      - '.github/workflows/logos-corpus.yml'

permissions:
  contents: write

concurrency:
  group: logos-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Logos source rights and interlinear foundation
        run: |
          python tools/validate_logos.py
          python tools/validate_logos_interlinear.py
          python tools/validate_logos_interlinear_prototype.py
          python tools/validate_logos_greek_nt_phase1.py

      - name: Build and validate Greek NT Phase 1 corpus
        run: |
          out="${RUNNER_TEMP}/logos-greek-nt-phase1"
          python scripts/vendor_greek_nt_phase1.py --output "$out"
          python tools/validate_logos_greek_nt_phase1.py --generated "$out"

      - name: Build and validate Greek NT production package for PR
        if: github.event_name == 'pull_request'
        run: |
          out="${RUNNER_TEMP}/logos-greek-nt-production"
          python scripts/vendor_greek_nt_production.py --output "$out"
          python tools/validate_logos_greek_nt_production.py --root "$out"

      - name: Vendor Greek NT production package on main
        if: github.event_name != 'pull_request'
        run: |
          python scripts/vendor_greek_nt_production.py
          python tools/validate_logos_greek_nt_production.py

      - name: Vendor pinned Douay-Rheims 1899 corpus
        run: python scripts/vendor_douay_rheims.py

      - name: Verify generated 73-book corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('cloud-backend/app/logos_corpus/eng_douay_rheims_1899')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['book_count'] == 73
          assert manifest['chapter_count'] >= 1300
          assert manifest['verse_count'] >= 34000
          assert manifest['translation']['rights'] == 'public-domain'
          assert manifest['source']['integrity'] == 'verified'
          book_files = [p for p in root.glob('*.json') if p.name != 'manifest.json']
          assert len(book_files) == 73, len(book_files)

          def verse(filename, chapter, number):
              data = json.loads((root / filename).read_text(encoding='utf-8'))
              return data['chapters'][str(chapter)][str(number)]

          assert verse('gen.json', 1, 1)
          assert verse('tob.json', 1, 1)
          assert verse('wis.json', 1, 1)
          assert verse('sir.json', 1, 1)
          assert verse('1ma.json', 1, 1)
          assert verse('2ma.json', 1, 1)
          assert verse('jhn.json', 3, 16)
          assert verse('rev.json', 22, 21)
          print(
              f"Verified {manifest['book_count']} books, "
              f"{manifest['chapter_count']} chapters, "
              f"{manifest['verse_count']} verse records"
          )
          PY

      - name: Commit deterministic corpora
        if: github.event_name != 'pull_request'
        run: |
          english_path='cloud-backend/app/logos_corpus/eng_douay_rheims_1899'
          greek_path='cloud-backend/app/logos_corpus/grc_sblgnt_morphgnt'
          git add --all -- "$english_path" "$greek_path"
          if git diff --cached --quiet -- "$english_path" "$greek_path"; then
            echo "Corpora are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: vendor deterministic Logos English and Greek corpora"
          git push origin HEAD:main
