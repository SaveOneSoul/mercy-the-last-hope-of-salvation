name: Vendor Logos Catholic Bible Corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/vendor_*.py'
      - 'cloud-backend/app/logos_interlinear/**'
      - 'cloud-backend/app/logos*.py'
      - 'tools/ci_sitecustomize/**'
      - 'tools/validate_logos*.py'
      - 'tools/audit_logos*.py'
      - 'LOGOS_INTERLINEAR_COVERAGE.md'
      - 'LOGOS_VERSIFICATION_RESOLUTION.md'
      - '.github/workflows/logos-corpus.yml'
  pull_request:
    paths:
      - 'scripts/vendor_*.py'
      - 'cloud-backend/app/logos_interlinear/**'
      - 'cloud-backend/app/logos*.py'
      - 'tools/ci_sitecustomize/**'
      - 'tools/validate_logos*.py'
      - 'tools/audit_logos*.py'
      - 'LOGOS_INTERLINEAR_COVERAGE.md'
      - 'LOGOS_VERSIFICATION_RESOLUTION.md'
      - '.github/workflows/logos-corpus.yml'

permissions:
  contents: write

concurrency:
  group: logos-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor-corpus:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}/tools/ci_sitecustomize
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Logos source rights and interlinear foundation
        run: |
          python tools/validate_logos.py
          python tools/validate_logos_interlinear.py
          python tools/validate_logos_interlinear_prototype.py
          python tools/validate_logos_greek_nt_phase1.py
          python tools/validate_logos_old_testament_phase1.py
          python tools/validate_logos_old_testament_phase1b.py
          python tools/validate_logos_greek_ot_linguistics_phase2.py
          python tools/validate_logos_versification.py

      - name: Compile Logos runtime modules
        run: |
          python -m py_compile \
            cloud-backend/app/logos_greek.py \
            cloud-backend/app/logos_ot_greek.py \
            cloud-backend/app/logos_ot_greek_full.py \
            cloud-backend/app/logos_ot_semitic.py \
            cloud-backend/app/logos_ot_latin.py \
            cloud-backend/app/logos_ot_interlinear.py \
            cloud-backend/app/logos_ot_greek_linguistics.py \
            cloud-backend/app/logos_nt_tagnt_linguistics.py \
            cloud-backend/app/logos_versification.py \
            cloud-backend/app/logos_advanced.py \
            tools/audit_logos_73_book_interlinear.py \
            tools/audit_logos_versification_resolution.py \
            tools/validate_logos_greek_ot_linguistics_phase2.py \
            tools/validate_logos_greek_ot_linguistics_corpus.py \
            tools/validate_logos_greek_nt_tagnt_john.py \
            tools/validate_logos_versification.py

      - name: Build and validate Greek OT linguistic Phase 2 production candidate
        if: github.event_name == 'pull_request'
        run: |
          out="${RUNNER_TEMP}/logos-greek-ot-linguistics-phase2"
          python scripts/vendor_greek_ot_linguistics_phase2.py --output "$out" --production
          python tools/validate_logos_greek_ot_linguistics_corpus.py --root "$out" --require-production

      - name: Build and validate Greek NT Phase 1 corpus
        run: |
          out="${RUNNER_TEMP}/logos-greek-nt-phase1"
          python scripts/vendor_greek_nt_phase1.py --output "$out"
          python tools/validate_logos_greek_nt_phase1.py --generated "$out"

      - name: Build and validate TAGNT John linguistic supplement
        if: github.event_name == 'pull_request'
        run: |
          out="${RUNNER_TEMP}/logos-greek-nt-tagnt-john"
          python scripts/vendor_greek_nt_tagnt_john.py --output "$out"
          python tools/validate_logos_greek_nt_tagnt_john.py --root "$out"

      - name: Build and validate Old Testament Phase 1A corpus
        run: |
          out="${RUNNER_TEMP}/logos-old-testament-phase1"
          python scripts/vendor_old_testament_phase1.py --output "$out"
          python tools/validate_logos_old_testament_phase1.py --generated "$out"

      - name: Build and validate Old Testament Phase 1B Greek corpus
        run: |
          out="${RUNNER_TEMP}/logos-old-testament-phase1b"
          python scripts/vendor_old_testament_phase1b.py --output "$out"
          python tools/validate_logos_old_testament_phase1b.py --generated "$out"

      - name: Build and validate Greek NT production package for PR
        if: github.event_name == 'pull_request'
        run: |
          out="${RUNNER_TEMP}/logos-greek-nt-production"
          python scripts/vendor_greek_nt_production.py --output "$out"
          python tools/validate_logos_greek_nt_production.py --root "$out"

      - name: Build and validate accepted OT Greek production package for PR
        if: github.event_name == 'pull_request'
        run: |
          out="${RUNNER_TEMP}/logos-ot-greek-production"
          python scripts/vendor_old_testament_greek_production.py --output "$out"
          python tools/validate_logos_old_testament_greek_production.py --root "$out"
          python tools/validate_logos_ot_greek_runtime.py --root "$out"

      - name: Build and validate complete Catholic Greek OT package for PR
        if: github.event_name == 'pull_request'
        run: |
          out="${RUNNER_TEMP}/logos-ot-greek-full"
          python scripts/vendor_old_testament_greek_full.py --output "$out"
          python tools/validate_logos_old_testament_greek_full.py --root "$out"

      - name: Build and validate OT Hebrew Aramaic production package for PR
        if: github.event_name == 'pull_request'
        run: |
          out="${RUNNER_TEMP}/logos-ot-semitic-production"
          python scripts/vendor_old_testament_semitic_production.py --output "$out"
          python tools/validate_logos_old_testament_semitic_production.py --root "$out"

      - name: Build and validate Clementine Vulgate package for PR
        if: github.event_name == 'pull_request'
        run: |
          out="${RUNNER_TEMP}/logos-vulgate-clementine"
          python scripts/vendor_vulgate_clementine.py --output "$out"
          python tools/validate_logos_vulgate_clementine.py --root "$out"

      - name: Vendor Greek NT production package on main
        if: github.event_name != 'pull_request'
        run: |
          python scripts/vendor_greek_nt_production.py
          python tools/validate_logos_greek_nt_production.py

      - name: Vendor Greek OT word-level linguistic package on main
        if: github.event_name != 'pull_request'
        run: |
          python scripts/vendor_greek_ot_linguistics_phase2.py --production
          python tools/validate_logos_greek_ot_linguistics_corpus.py --require-production

      - name: Vendor TAGNT John linguistic supplement on main
        if: github.event_name != 'pull_request'
        run: |
          python scripts/vendor_greek_nt_tagnt_john.py
          python tools/validate_logos_greek_nt_tagnt_john.py

      - name: Vendor accepted OT Greek production package on main
        if: github.event_name != 'pull_request'
        run: |
          python scripts/vendor_old_testament_greek_production.py
          python tools/validate_logos_old_testament_greek_production.py
          python tools/validate_logos_ot_greek_runtime.py

      - name: Vendor complete Catholic Greek OT package on main
        if: github.event_name != 'pull_request'
        run: |
          python scripts/vendor_old_testament_greek_full.py
          python tools/validate_logos_old_testament_greek_full.py

      - name: Vendor OT Hebrew Aramaic production package on main
        if: github.event_name != 'pull_request'
        run: |
          python scripts/vendor_old_testament_semitic_production.py
          python tools/validate_logos_old_testament_semitic_production.py

      - name: Vendor Clementine Vulgate package on main
        if: github.event_name != 'pull_request'
        run: |
          python scripts/vendor_vulgate_clementine.py
          python tools/validate_logos_vulgate_clementine.py

      - name: Vendor pinned Douay-Rheims 1899 corpus
        run: python scripts/vendor_douay_rheims.py

      - name: Verify generated 73-book English corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('cloud-backend/app/logos_corpus/eng_douay_rheims_1899')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['book_count'] == 73
          assert manifest['chapter_count'] >= 1300
          assert manifest['verse_count'] >= 34000
          assert manifest['translation']['rights'] == 'public-domain'
          assert manifest['source']['integrity'] == 'verified'
          book_files = [p for p in root.glob('*.json') if p.name != 'manifest.json']
          assert len(book_files) == 73, len(book_files)

          def verse(filename, chapter, number):
              data = json.loads((root / filename).read_text(encoding='utf-8'))
              return data['chapters'][str(chapter)][str(number)]

          assert verse('gen.json', 1, 1)
          assert verse('tob.json', 1, 1)
          assert verse('wis.json', 1, 1)
          assert verse('sir.json', 1, 1)
          assert verse('1ma.json', 1, 1)
          assert verse('2ma.json', 1, 1)
          assert verse('jhn.json', 3, 16)
          assert verse('rev.json', 22, 21)
          print(
              f"Verified {manifest['book_count']} books, "
              f"{manifest['chapter_count']} chapters, "
              f"{manifest['verse_count']} verse records"
          )
          PY

      - name: Generate 73-book interlinear coverage audit for PR
        if: github.event_name == 'pull_request'
        run: |
          audit="${RUNNER_TEMP}/logos-73-book-interlinear-audit"
          mkdir -p "$audit"
          python tools/audit_logos_73_book_interlinear.py \
            --greek-nt-root "${RUNNER_TEMP}/logos-greek-nt-production" \
            --greek-nt-tagnt-root "${RUNNER_TEMP}/logos-greek-nt-tagnt-john" \
            --greek-ot-accepted-root "${RUNNER_TEMP}/logos-ot-greek-production" \
            --greek-ot-full-root "${RUNNER_TEMP}/logos-ot-greek-full" \
            --greek-ot-linguistics-root "${RUNNER_TEMP}/logos-greek-ot-linguistics-phase2" \
            --semitic-root "${RUNNER_TEMP}/logos-ot-semitic-production" \
            --latin-root "${RUNNER_TEMP}/logos-vulgate-clementine" \
            --json-output "$audit/coverage-audit.json" \
            --markdown-output "$audit/LOGOS_INTERLINEAR_COVERAGE.md"

      - name: Generate versification resolution audit for PR
        if: github.event_name == 'pull_request'
        run: |
          audit="${RUNNER_TEMP}/logos-73-book-interlinear-audit"
          python tools/validate_logos_versification.py
          python tools/audit_logos_versification_resolution.py \
            --coverage "$audit/coverage-audit.json" \
            --json-output "$audit/versification-resolution.json" \
            --markdown-output "$audit/LOGOS_VERSIFICATION_RESOLUTION.md"

      - name: Upload 73-book interlinear coverage audit
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: logos-73-book-interlinear-coverage
          path: |
            ${{ runner.temp }}/logos-73-book-interlinear-audit/coverage-audit.json
            ${{ runner.temp }}/logos-73-book-interlinear-audit/LOGOS_INTERLINEAR_COVERAGE.md
            ${{ runner.temp }}/logos-73-book-interlinear-audit/versification-resolution.json
            ${{ runner.temp }}/logos-73-book-interlinear-audit/LOGOS_VERSIFICATION_RESOLUTION.md
          if-no-files-found: error

      - name: Generate deterministic 73-book interlinear coverage audit on main
        if: github.event_name != 'pull_request'
        run: python tools/audit_logos_73_book_interlinear.py

      - name: Generate deterministic versification resolution audit on main
        if: github.event_name != 'pull_request'
        run: |
          python tools/validate_logos_versification.py
          python tools/audit_logos_versification_resolution.py

      - name: Commit deterministic corpora and coverage audit
        if: github.event_name != 'pull_request'
        run: |
          english_path='cloud-backend/app/logos_corpus/eng_douay_rheims_1899'
          greek_nt_path='cloud-backend/app/logos_corpus/grc_sblgnt_morphgnt'
          greek_nt_tagnt_path='cloud-backend/app/logos_corpus/grc_nt_tagnt_john_pa'
          greek_ot_path='cloud-backend/app/logos_corpus/grc_ot_catholic_swete'
          greek_ot_full_path='cloud-backend/app/logos_corpus/grc_ot_catholic_full'
          greek_ot_linguistics_path='cloud-backend/app/logos_corpus/grc_ot_rahlfs_lxx_morph'
          semitic_ot_path='cloud-backend/app/logos_corpus/heb_arc_oshb_wlc'
          latin_path='cloud-backend/app/logos_corpus/lat_vulgate_clementine'
          audit_json='cloud-backend/app/logos_interlinear/coverage-audit.json'
          audit_md='LOGOS_INTERLINEAR_COVERAGE.md'
          resolution_json='cloud-backend/app/logos_interlinear/versification/resolution-audit.json'
          resolution_md='LOGOS_VERSIFICATION_RESOLUTION.md'
          git add --all -- \
            "$english_path" "$greek_nt_path" "$greek_nt_tagnt_path" "$greek_ot_path" \
            "$greek_ot_full_path" "$greek_ot_linguistics_path" "$semitic_ot_path" "$latin_path" \
            "$audit_json" "$audit_md" "$resolution_json" "$resolution_md"
          if git diff --cached --quiet -- \
            "$english_path" "$greek_nt_path" "$greek_nt_tagnt_path" "$greek_ot_path" \
            "$greek_ot_full_path" "$greek_ot_linguistics_path" "$semitic_ot_path" "$latin_path" \
            "$audit_json" "$audit_md" "$resolution_json" "$resolution_md"; then
            echo "Corpora and Logos coverage/resolution audits are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: vendor Logos corpora and coverage resolution audits"
          git push origin HEAD:main
