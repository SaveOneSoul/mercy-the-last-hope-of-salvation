name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Refresh sitemap from published CMS content
        run: python3 scripts/build_sitemap.py
      - name: Stage static site only
        run: |
          mkdir -p _site
          cp index.html mercy-manifest.webmanifest mercy-sw.js .nojekyll _site/ 2>/dev/null || true
          cp robots.txt sitemap.xml _site/ 2>/dev/null || true
          for f in google*.html; do
            [ -f "$f" ] && cp "$f" _site/
          done
          cp -R css javascript pages kh _site/
          mkdir -p _site/data
          cp data/saint-details.json data/saint-profiles.json _site/data/
          cp data/saint-videos.json _site/data/
          cp data/formation-courses.json _site/data/
          cp data/logos-bible-atlas.json _site/data/
          cp -R data/courses data/prayers _site/data/
          if [ -d data/patristic-corpus ]; then
            cp -R data/patristic-corpus _site/data/
          fi
          mkdir -p _site/data/logos-interlinear
          cp cloud-backend/app/logos_interlinear/prototypes/john-1-1/JHN-1-1.json _site/data/logos-interlinear/
          cp cloud-backend/app/logos_interlinear/prototypes/john-1-1/sources-manifest.json _site/data/logos-interlinear/
      - name: Vendor Leaflet 1.9.4 for interactive Bible maps
        run: |
          set -euo pipefail
          mkdir -p _site/vendor/leaflet
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/Leaflet/Leaflet/releases/download/v1.9.4/leaflet.zip \
            -o /tmp/leaflet-1.9.4.zip
          unzip -q /tmp/leaflet-1.9.4.zip -d /tmp/leaflet-dist
          LEAFLET_JS="$(find /tmp/leaflet-dist -type f -name leaflet.js -print -quit)"
          LEAFLET_CSS="$(find /tmp/leaflet-dist -type f -name leaflet.css -print -quit)"
          test -n "$LEAFLET_JS"
          test -n "$LEAFLET_CSS"
          cp "$LEAFLET_JS" _site/vendor/leaflet/leaflet.js
          cp "$LEAFLET_CSS" _site/vendor/leaflet/leaflet.css
          LEAFLET_DIR="$(dirname "$LEAFLET_CSS")"
          if [ -d "$LEAFLET_DIR/images" ]; then
            cp -R "$LEAFLET_DIR/images" _site/vendor/leaflet/
          fi
          JS_SHA="$(openssl dgst -sha256 -binary _site/vendor/leaflet/leaflet.js | openssl base64 -A)"
          CSS_SHA="$(openssl dgst -sha256 -binary _site/vendor/leaflet/leaflet.css | openssl base64 -A)"
          echo "Leaflet JS SHA256(base64): $JS_SHA"
          echo "Leaflet CSS SHA256(base64): $CSS_SHA"
          test "$JS_SHA" = "hdRVtFIkFfa63EKg59F8kZ0QA0fWuJWL0Nxzj97NbVA="
          test "$CSS_SHA" = "p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          curl -fsSL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/Leaflet/Leaflet/v1.9.4/LICENSE \
            -o _site/vendor/leaflet/LICENSE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
