name: Mercy Backend Smoke

on:
  push:
    branches: [main]
    paths:
      - 'cloud-backend/**'
      - '.github/workflows/backend-smoke.yml'
  pull_request:
    paths:
      - 'cloud-backend/**'
      - '.github/workflows/backend-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Import application, CMS, SEO, Logos and intention-network models
        env:
          DATABASE_URL: sqlite:///./ci-mercy.db
          ENABLE_DOCS: 'false'
          ADMIN_SESSION_SECRET: 'ci-only-session-secret-not-for-production'
        run: |
          python - <<'PY'
          from app.main import app
          from app.logos import _corpus_manifest
          from app.logos_context import BOOK_PROFILES, RESEARCH_LIBRARIES
          from app.logos_greek import _greek_manifest
          from app.logos_ot_greek import _ot_greek_manifest
          from app.logos_ot_greek_full import _study_payload as _full_greek_study_payload
          from app.logos_ot_latin import _study_payload as _latin_study_payload
          from app.logos_ot_semitic import _ot_semitic_manifest, _study_payload as _semitic_study_payload
          from app.logos_versification import registry_summary
          from app.models import CMSMedia, CMSPublication
          from app.prayer_network import (
              MassAssignment,
              MassIntentionRequest,
              PrayerDistributionLog,
              PrayerNetworkRequest,
              PriestRegistration,
          )
          from app.priest_portal import PriestPortalInvite, PriestPortalSession

          assert app.version == '2.10.0'
          assert len(BOOK_PROFILES) == 73
          assert len(RESEARCH_LIBRARIES) >= 8
          assert CMSPublication.__tablename__ == 'cms_publications'
          assert CMSMedia.__tablename__ == 'cms_media'
          assert PrayerNetworkRequest.__tablename__ == 'prayer_network_requests'
          assert PrayerDistributionLog.__tablename__ == 'prayer_distribution_logs'
          assert MassIntentionRequest.__tablename__ == 'mass_intention_requests'
          assert PriestRegistration.__tablename__ == 'priest_registrations'
          assert MassAssignment.__tablename__ == 'mass_assignments'
          assert PriestPortalInvite.__tablename__ == 'priest_portal_invites'
          assert PriestPortalSession.__tablename__ == 'priest_portal_sessions'
          paths = {route.path for route in app.routes}
          for required in (
              '/api/content/seo-manifest',
              '/api/prayer-network/requests',
              '/api/mass-intentions',
              '/api/priest-network/register',
              '/api/admin/prayer-network/requests',
              '/api/admin/mass-intentions',
              '/api/admin/priest-network',
              '/api/admin/priest-network/{priest_id}/portal-invite',
              '/api/priest/activate',
              '/api/priest/mass-intentions/available',
              '/api/priest/assignments',
              '/api/logos/catalog',
              '/api/logos/source-rights',
              '/api/logos/passage',
              '/api/logos/interlinear',
              '/api/logos/commentary',
              '/api/logos/fathers',
              '/api/logos/background',
              '/api/logos/chronology',
              '/api/logos/traditions',
              '/api/logos/preacher',
              '/api/logos/places',
              '/api/logos/media',
              '/api/logos/ai',
              '/api/logos/advanced-ai',
              '/api/logos/greek/catalog',
              '/api/logos/greek/source-rights',
              '/api/logos/greek/interlinear',
              '/api/logos/ot-greek/catalog',
              '/api/logos/ot-greek/source-rights',
              '/api/logos/ot-greek/interlinear',
              '/api/logos/ot-semitic/catalog',
              '/api/logos/ot-semitic/source-rights',
              '/api/logos/ot-semitic/interlinear',
              '/api/logos/ot-latin/catalog',
              '/api/logos/ot-latin/source-rights',
              '/api/logos/ot-latin/interlinear',
              '/api/logos/ot-interlinear/catalog',
              '/api/logos/ot-interlinear',
              '/priest',
          ):
              assert required in paths, required
          assert '/priest/activate' not in paths
          manifest = _corpus_manifest()
          if manifest:
              assert manifest['book_count'] == 73
              assert manifest['chapter_count'] >= 1300
              assert manifest['verse_count'] >= 34000
              assert manifest['translation']['rights'] == 'public-domain'
          greek = _greek_manifest()
          if greek:
              assert greek['production_enabled'] is True
              assert greek['phase1_acceptance']['book_count'] == 27
              assert greek['sources']['surface']['license'] == 'CC BY 4.0'
              assert greek['sources']['linguistics']['license'] == 'CC BY-SA 3.0'
          ot_greek = _ot_greek_manifest()
          if ot_greek:
              assert ot_greek['production_enabled'] is True
              assert ot_greek['phase1b_acceptance']['witness_count'] == 15
              assert ot_greek['phase1b_acceptance']['source_verse_record_count'] == 5337
              assert ot_greek['source']['license'] == 'CC BY-SA 4.0'
              assert ot_greek['partition']['share_alike'] is True
              assert ot_greek['mapping']['fabricate_verse_boundaries'] is False
          ot_semitic = _ot_semitic_manifest()
          if ot_semitic:
              assert ot_semitic['production_enabled'] is True
              assert ot_semitic['phase1a_acceptance']['masoretic_book_witness_count'] == 39
              assert ot_semitic['phase1a_acceptance']['verse_count'] == 23213
              assert ot_semitic['phase1a_acceptance']['token_count'] == 305507
              assert ot_semitic['source']['surface_rights'] == 'Public Domain'
              assert ot_semitic['source']['linguistic_annotation_license'] == 'CC BY 4.0'
              assert ot_semitic['versification']['automatic_remapping'] is False

          registry = registry_summary()
          assert registry['verified_mapping_count'] >= 12
          assert registry['verified_book_count'] >= 9

          judith = _latin_study_payload('Judith 4')
          assert judith['alignment']['mode'] == 'verified-explicit-map'
          assert judith['alignment']['verified_mapping'] is True
          assert len(judith['verses']) == 16
          by_verse = {row['verse']: row for row in judith['verses']}
          assert by_verse[5]['mapping_relationship'] == 'merge'
          assert [(row['chapter'], row['verse']) for row in by_verse[5]['source_verses']] == [(4, 5), (4, 6)]
          assert by_verse[6]['mapping_relationship'] == 'offset'
          assert [(row['chapter'], row['verse']) for row in by_verse[6]['source_verses']] == [(4, 7)]
          assert [(row['chapter'], row['verse']) for row in by_verse[16]['source_verses']] == [(4, 17)]
          assert all(row['surface'] for row in judith['verses'])

          sirach = _latin_study_payload('Sirach 29')
          assert sirach['alignment']['mode'] == 'verified-explicit-map'
          assert sirach['alignment']['verified_mapping'] is True
          assert len(sirach['verses']) == 34
          sirach_by_verse = {row['verse']: row for row in sirach['verses']}
          assert sirach_by_verse[15]['mapping_relationship'] == 'identity'
          assert [(row['chapter'], row['verse']) for row in sirach_by_verse[15]['source_verses']] == [(29, 15)]
          assert sirach_by_verse[16]['mapping_relationship'] == 'merge'
          assert [(row['chapter'], row['verse']) for row in sirach_by_verse[16]['source_verses']] == [(29, 16), (29, 17)]
          assert sirach_by_verse[17]['mapping_relationship'] == 'offset'
          assert [(row['chapter'], row['verse']) for row in sirach_by_verse[17]['source_verses']] == [(29, 18)]
          assert [(row['chapter'], row['verse']) for row in sirach_by_verse[34]['source_verses']] == [(29, 35)]
          assert all(row['surface'] for row in sirach['verses'])

          lamentations = _full_greek_study_payload('Lamentations 3')
          assert lamentations['alignment']['mode'] == 'verified-explicit-map'
          assert lamentations['alignment']['verified_mapping'] is True
          assert len(lamentations['verses']) == 66
          lamentations_by_verse = {row['verse']: row for row in lamentations['verses']}
          assert lamentations_by_verse[21]['mapping_relationship'] == 'identity'
          assert [(row['source_chapter'], row['source_verse']) for row in lamentations_by_verse[21]['source_verses']] == [('3', '21')]
          for missing in (22, 23, 24, 29):
              assert lamentations_by_verse[missing]['mapping_relationship'] == 'canonical-only'
              assert lamentations_by_verse[missing]['source_verses'] == []
              assert lamentations_by_verse[missing]['surface'] == ''
              assert lamentations_by_verse[missing]['source_missing'] is True
          assert [(row['source_chapter'], row['source_verse']) for row in lamentations_by_verse[25]['source_verses']] == [('3', '25')]
          assert [(row['source_chapter'], row['source_verse']) for row in lamentations_by_verse[28]['source_verses']] == [('3', '28')]
          assert [(row['source_chapter'], row['source_verse']) for row in lamentations_by_verse[30]['source_verses']] == [('3', '30')]
          assert [(row['source_chapter'], row['source_verse']) for row in lamentations_by_verse[66]['source_verses']] == [('3', '66')]
          assert all(row['surface'] or row['source_missing'] for row in lamentations['verses'])

          amos_greek = _full_greek_study_payload('Amos 6')
          assert amos_greek['alignment']['mode'] == 'verified-explicit-map'
          assert amos_greek['alignment']['verified_mapping'] is True
          assert len(amos_greek['verses']) == 15
          amos_greek_by_verse = {row['verse']: row for row in amos_greek['verses']}
          assert amos_greek_by_verse[9]['mapping_relationship'] == 'identity'
          assert [(row['source_chapter'], row['source_verse']) for row in amos_greek_by_verse[9]['source_verses']] == [('6', '9')]
          for canonical in (10, 11):
              assert amos_greek_by_verse[canonical]['mapping_relationship'] == 'split'
              assert [(row['source_chapter'], row['source_verse']) for row in amos_greek_by_verse[canonical]['source_verses']] == [('6', '10')]
              assert amos_greek_by_verse[canonical]['surface']
          assert amos_greek_by_verse[12]['mapping_relationship'] == 'offset'
          assert [(row['source_chapter'], row['source_verse']) for row in amos_greek_by_verse[12]['source_verses']] == [('6', '11')]
          assert [(row['source_chapter'], row['source_verse']) for row in amos_greek_by_verse[15]['source_verses']] == [('6', '14')]

          amos_semitic = _semitic_study_payload('Amos 6')
          assert amos_semitic['alignment']['mode'] == 'verified-explicit-map'
          assert amos_semitic['alignment']['verified_mapping'] is True
          assert len(amos_semitic['verses']) == 15
          amos_semitic_by_verse = {row['verse']: row for row in amos_semitic['verses']}
          assert amos_semitic_by_verse[9]['mapping_relationship'] == 'identity'
          assert [(row['chapter'], row['verse']) for row in amos_semitic_by_verse[9]['source_verses']] == [(6, 9)]
          for canonical in (10, 11):
              assert amos_semitic_by_verse[canonical]['mapping_relationship'] == 'split'
              assert [(row['chapter'], row['verse']) for row in amos_semitic_by_verse[canonical]['source_verses']] == [(6, 10)]
              assert amos_semitic_by_verse[canonical]['tokens']
          assert [row['id'] for row in amos_semitic_by_verse[10]['tokens']] == [row['id'] for row in amos_semitic_by_verse[11]['tokens']]
          assert amos_semitic_by_verse[12]['mapping_relationship'] == 'offset'
          assert [(row['chapter'], row['verse']) for row in amos_semitic_by_verse[12]['source_verses']] == [(6, 11)]
          assert [(row['chapter'], row['verse']) for row in amos_semitic_by_verse[15]['source_verses']] == [(6, 14)]
          assert len({row['id'] for row in amos_semitic['tokens']}) == len(amos_semitic['tokens'])

          micah_semitic_4 = _semitic_study_payload('Micah 4')
          assert micah_semitic_4['alignment']['mode'] == 'verified-explicit-map'
          assert micah_semitic_4['alignment']['verified_mapping'] is True
          assert len(micah_semitic_4['verses']) == 13
          micah4 = {row['verse']: row for row in micah_semitic_4['verses']}
          assert [(row['chapter'], row['verse']) for row in micah4[13]['source_verses']] == [(4, 13)]

          micah_semitic_5 = _semitic_study_payload('Micah 5')
          assert micah_semitic_5['alignment']['mode'] == 'verified-explicit-map'
          assert micah_semitic_5['alignment']['verified_mapping'] is True
          assert micah_semitic_5['alignment']['numeric_identifier_identity'] is True
          assert micah_semitic_5['alignment']['exact'] is False
          assert len(micah_semitic_5['verses']) == 14
          micah5s = {row['verse']: row for row in micah_semitic_5['verses']}
          assert micah5s[1]['mapping_relationship'] == 'renumber'
          assert [(row['chapter'], row['verse']) for row in micah5s[1]['source_verses']] == [(4, 14)]
          assert micah5s[2]['mapping_relationship'] == 'offset'
          assert [(row['chapter'], row['verse']) for row in micah5s[2]['source_verses']] == [(5, 1)]
          assert [(row['chapter'], row['verse']) for row in micah5s[10]['source_verses']] == [(5, 9)]
          assert micah5s[11]['mapping_relationship'] == 'merge'
          assert [(row['chapter'], row['verse']) for row in micah5s[11]['source_verses']] == [(5, 10), (5, 11)]
          assert [(row['chapter'], row['verse']) for row in micah5s[12]['source_verses']] == [(5, 12)]
          assert [(row['chapter'], row['verse']) for row in micah5s[14]['source_verses']] == [(5, 14)]

          micah_greek_5 = _full_greek_study_payload('Micah 5')
          assert micah_greek_5['alignment']['mode'] == 'verified-explicit-map'
          assert micah_greek_5['alignment']['verified_mapping'] is True
          assert len(micah_greek_5['verses']) == 14
          micah5g = {row['verse']: row for row in micah_greek_5['verses']}
          assert micah5g[10]['mapping_relationship'] == 'identity'
          assert [(row['source_chapter'], row['source_verse']) for row in micah5g[10]['source_verses']] == [('5', '10')]
          assert micah5g[11]['mapping_relationship'] == 'merge'
          assert [(row['source_chapter'], row['source_verse']) for row in micah5g[11]['source_verses']] == [('5', '11'), ('5', '12')]
          assert micah5g[12]['mapping_relationship'] == 'offset'
          assert [(row['source_chapter'], row['source_verse']) for row in micah5g[12]['source_verses']] == [('5', '13')]
          assert [(row['source_chapter'], row['source_verse']) for row in micah5g[14]['source_verses']] == [('5', '15')]

          zephaniah_2 = _full_greek_study_payload('Zephaniah 2')
          assert zephaniah_2['alignment']['mode'] == 'verified-explicit-map'
          assert zephaniah_2['alignment']['verified_mapping'] is True
          assert len(zephaniah_2['verses']) == 15
          zeph2 = {row['verse']: row for row in zephaniah_2['verses']}
          assert zeph2[14]['mapping_relationship'] == 'identity'
          assert [(row['source_chapter'], row['source_verse']) for row in zeph2[14]['source_verses']] == [('2', '14')]
          assert zeph2[15]['mapping_relationship'] == 'renumber'
          assert [(row['source_chapter'], row['source_verse']) for row in zeph2[15]['source_verses']] == [('3', '1')]

          zephaniah_3 = _full_greek_study_payload('Zephaniah 3')
          assert zephaniah_3['alignment']['mode'] == 'verified-explicit-map'
          assert zephaniah_3['alignment']['verified_mapping'] is True
          assert len(zephaniah_3['verses']) == 20
          zeph3 = {row['verse']: row for row in zephaniah_3['verses']}
          for canonical in (1, 2):
              assert zeph3[canonical]['mapping_relationship'] == 'split'
              assert [(row['source_chapter'], row['source_verse']) for row in zeph3[canonical]['source_verses']] == [('3', '2')]
              assert zeph3[canonical]['surface']
          assert zeph3[3]['mapping_relationship'] == 'identity'
          assert [(row['source_chapter'], row['source_verse']) for row in zeph3[3]['source_verses']] == [('3', '3')]
          for canonical in (12, 13):
              assert zeph3[canonical]['mapping_relationship'] == 'split'
              assert [(row['source_chapter'], row['source_verse']) for row in zeph3[canonical]['source_verses']] == [('3', '12')]
              assert zeph3[canonical]['surface']
          assert zeph3[14]['mapping_relationship'] == 'identity'
          assert [(row['source_chapter'], row['source_verse']) for row in zeph3[14]['source_verses']] == [('3', '14')]
          assert [(row['source_chapter'], row['source_verse']) for row in zeph3[20]['source_verses']] == [('3', '20')]

          malachi_3 = _semitic_study_payload('Malachi 3')
          assert malachi_3['alignment']['mode'] == 'verified-explicit-map'
          assert malachi_3['alignment']['verified_mapping'] is True
          assert len(malachi_3['verses']) == 18
          mal3 = {row['verse']: row for row in malachi_3['verses']}
          assert mal3[1]['mapping_relationship'] == 'identity'
          assert [(row['chapter'], row['verse']) for row in mal3[1]['source_verses']] == [(3, 1)]
          assert [(row['chapter'], row['verse']) for row in mal3[18]['source_verses']] == [(3, 18)]

          malachi_4 = _semitic_study_payload('Malachi 4')
          assert malachi_4['alignment']['mode'] == 'verified-explicit-map'
          assert malachi_4['alignment']['verified_mapping'] is True
          assert malachi_4['alignment']['reason'] == 'verified_explicit_cross_chapter_map'
          assert malachi_4['alignment']['source_verse_count'] == 0
          assert len(malachi_4['verses']) == 6
          mal4 = {row['verse']: row for row in malachi_4['verses']}
          for canonical, source in enumerate(range(19, 25), start=1):
              assert mal4[canonical]['mapping_relationship'] == 'renumber'
              assert [(row['chapter'], row['verse']) for row in mal4[canonical]['source_verses']] == [(3, source)]
              assert mal4[canonical]['tokens']
          assert len({row['id'] for row in malachi_4['tokens']}) == len(malachi_4['tokens'])

          joel_2 = _semitic_study_payload('Joel 2')
          assert joel_2['alignment']['mode'] == 'verified-explicit-map'
          assert joel_2['alignment']['verified_mapping'] is True
          assert len(joel_2['verses']) == 32
          joel2 = {row['verse']: row for row in joel_2['verses']}
          assert joel2[27]['mapping_relationship'] == 'identity'
          assert [(row['chapter'], row['verse']) for row in joel2[27]['source_verses']] == [(2, 27)]
          assert joel2[28]['mapping_relationship'] == 'renumber'
          assert [(row['chapter'], row['verse']) for row in joel2[28]['source_verses']] == [(3, 1)]
          assert [(row['chapter'], row['verse']) for row in joel2[32]['source_verses']] == [(3, 5)]

          joel_3 = _semitic_study_payload('Joel 3')
          assert joel_3['alignment']['mode'] == 'verified-explicit-map'
          assert joel_3['alignment']['verified_mapping'] is True
          assert len(joel_3['verses']) == 21
          joel3 = {row['verse']: row for row in joel_3['verses']}
          assert joel3[1]['mapping_relationship'] == 'renumber'
          assert [(row['chapter'], row['verse']) for row in joel3[1]['source_verses']] == [(4, 1)]
          assert [(row['chapter'], row['verse']) for row in joel3[10]['source_verses']] == [(4, 10)]
          assert [(row['chapter'], row['verse']) for row in joel3[21]['source_verses']] == [(4, 21)]
          assert all(row['tokens'] for row in joel_3['verses'])

          nahum_semitic_1 = _semitic_study_payload('Nahum 1')
          assert nahum_semitic_1['alignment']['mode'] == 'verified-explicit-map'
          assert nahum_semitic_1['alignment']['verified_mapping'] is True
          assert len(nahum_semitic_1['verses']) == 15
          nah1s = {row['verse']: row for row in nahum_semitic_1['verses']}
          assert nah1s[14]['mapping_relationship'] == 'identity'
          assert [(row['chapter'], row['verse']) for row in nah1s[14]['source_verses']] == [(1, 14)]
          assert nah1s[15]['mapping_relationship'] == 'renumber'
          assert [(row['chapter'], row['verse']) for row in nah1s[15]['source_verses']] == [(2, 1)]

          nahum_semitic_2 = _semitic_study_payload('Nahum 2')
          assert nahum_semitic_2['alignment']['mode'] == 'verified-explicit-map'
          assert nahum_semitic_2['alignment']['verified_mapping'] is True
          assert len(nahum_semitic_2['verses']) == 13
          nah2s = {row['verse']: row for row in nahum_semitic_2['verses']}
          assert nah2s[1]['mapping_relationship'] == 'offset'
          assert [(row['chapter'], row['verse']) for row in nah2s[1]['source_verses']] == [(2, 2)]
          assert [(row['chapter'], row['verse']) for row in nah2s[13]['source_verses']] == [(2, 14)]

          nahum_greek_1 = _full_greek_study_payload('Nahum 1')
          assert nahum_greek_1['alignment']['mode'] == 'verified-explicit-map'
          assert nahum_greek_1['alignment']['verified_mapping'] is True
          assert nahum_greek_1['alignment']['numeric_identifier_identity'] is True
          assert nahum_greek_1['alignment']['exact'] is False
          assert len(nahum_greek_1['verses']) == 15
          nah1g = {row['verse']: row for row in nahum_greek_1['verses']}
          assert nah1g[15]['mapping_relationship'] == 'merge'
          assert [(row['source_chapter'], row['source_verse']) for row in nah1g[15]['source_verses']] == [('1', '15'), ('2', '1')]

          nahum_greek_2 = _full_greek_study_payload('Nahum 2')
          assert nahum_greek_2['alignment']['mode'] == 'verified-explicit-map'
          assert nahum_greek_2['alignment']['verified_mapping'] is True
          assert len(nahum_greek_2['verses']) == 13
          nah2g = {row['verse']: row for row in nahum_greek_2['verses']}
          assert nah2g[1]['mapping_relationship'] == 'offset'
          assert [(row['source_chapter'], row['source_verse']) for row in nah2g[1]['source_verses']] == [('2', '2')]
          assert [(row['source_chapter'], row['source_verse']) for row in nah2g[13]['source_verses']] == [('2', '14')]

          print('Mercy backend CMS SEO + Logos 73-book interlinear + verified Judith/Sirach Latin + Lamentations/Amos/Micah/Zephaniah/Malachi/Joel/Nahum source versification + prayer/Mass/priest portal smoke test passed')
          PY
